---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-lifecycle-controller
  namespace: kube-system
  labels:
    app: node-lifecycle-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-lifecycle-controller
  template:
    metadata:
      labels:
        app: node-lifecycle-controller
    spec:
      serviceAccountName: node-lifecycle-controller
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      containers:
        - name: node-lifecycle-controller
          image: ghcr.io/cozystack/local-ccm:v0.2.1
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/node-lifecycle-controller
          args:
            - --watch-autoscaler-taint=true
            - --not-ready-timeout=5m
            - --ping-timeout=5s
            - --ping-count=3
            - --reconcile-interval=30s
            - --leader-elect=true
            - --namespace=$(POD_NAMESPACE)
            - --v=2
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            capabilities:
              add:
                - NET_RAW
            runAsUser: 0
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
